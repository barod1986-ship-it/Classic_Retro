name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

  pokefirered-reference-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Classic Retro
        uses: actions/checkout@v6
        with:
          path: toolkit

      - name: Checkout pristine pinned pokefirered
        uses: actions/checkout@v6
        with:
          repository: pret/pokefirered
          ref: c75f352304d529f6ba92d4f74b9cf8b5c3810788
          path: upstream-base

      - name: Checkout Arabic target pokefirered
        uses: actions/checkout@v6
        with:
          repository: pret/pokefirered
          ref: c75f352304d529f6ba92d4f74b9cf8b5c3810788
          path: upstream-target

      - name: Checkout pinned agbcc
        uses: actions/checkout@v6
        with:
          repository: pret/agbcc
          ref: da598c1d918402c42c0c0d7128ba14567f3175e9
          path: agbcc

      - name: Checkout pinned Flips
        uses: actions/checkout@v6
        with:
          repository: bates64/flips
          ref: 6caac470f7fc096b0c5fdc374b65954f8bac5b16
          path: flips

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev fontconfig

      - name: Install toolkit
        working-directory: toolkit
        run: python -m pip install -e .

      - name: Verify Arabic source overlay against pinned upstream
        working-directory: toolkit
        run: classic-retro pokemon-gen3 source-check ../upstream-target

      - name: Build agbcc and install into both source trees
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../upstream-base
          ./install.sh ../upstream-target

      - name: Build pristine FireRed Rev 1
        working-directory: upstream-base
        run: make -j2 firered_rev1

      - name: Verify pristine ROM identity
        working-directory: upstream-base
        run: |
          echo "dd5945db9b930750cb39d00c84da8571feebf417  pokefirered_rev1.gba" | sha1sum -c -
          test "$(sha256sum pokefirered_rev1.gba | awk '{print $1}')" = "729041b940afe031302d630fdbe57c0c145f3f7b6d9b8eca5e98678d0ca4d059"

      - name: Apply Arabic renderer, readable Kufi font, and full OAK speech translation
        working-directory: toolkit
        run: |
          mkdir -p ../artifact
          NOTO_COMMIT=ffebf8c1ee449e544955a7e813c54f9b73848eac
          ARABIC_FONT=../reference-font.ttf
          curl --fail --location "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/hinted/ttf/NotoKufiArabic/NotoKufiArabic-SemiBold.ttf" -o "$ARABIC_FONT"
          echo "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e  $ARABIC_FONT" | sha256sum -c -
          curl --fail --location "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/LICENSE" -o ../artifact/FONT-LICENSE.txt
          classic-retro pokemon-gen3 prepare-arabic-source ../upstream-target --font "$ARABIC_FONT" | tee ../artifact/build-report.json
          cp ../upstream-target/graphics/fonts/arabic_normal.png ../artifact/arabic_normal.png
          fc-scan --format '%{family}\n%{style}\n' "$ARABIC_FONT" > ../artifact/font-info.txt

      - name: Build Arabic FireRed Rev 1 with matching compiler
        working-directory: upstream-target
        run: make -j2 firered_rev1

      - name: Build Flips CLI
        working-directory: flips
        run: TARGET=cli make CFLAGS="-O3"

      - name: Create and verify BPS patch
        run: |
          mkdir -p artifact
          ./flips/flips --create --exact --bps upstream-base/pokefirered_rev1.gba upstream-target/pokefirered_rev1.gba artifact/firered-rev1-arabic-oak-full.bps
          ./flips/flips --apply artifact/firered-rev1-arabic-oak-full.bps upstream-base/pokefirered_rev1.gba artifact/verified.gba
          cmp artifact/verified.gba upstream-target/pokefirered_rev1.gba
          rm artifact/verified.gba

      - name: Write patch manifest
        run: |
          BASE_SHA1="$(sha1sum upstream-base/pokefirered_rev1.gba | awk '{print $1}')"
          BASE_SHA256="$(sha256sum upstream-base/pokefirered_rev1.gba | awk '{print $1}')"
          TARGET_SHA256="$(sha256sum upstream-target/pokefirered_rev1.gba | awk '{print $1}')"
          PATCH_SHA256="$(sha256sum artifact/firered-rev1-arabic-oak-full.bps | awk '{print $1}')"
          PATCH_BYTES="$(stat -c %s artifact/firered-rev1-arabic-oak-full.bps)"
          RTL_RIGHT_X="$(python -c 'import json; print(json.load(open("artifact/build-report.json"))["oak_intro_right_x"])')"
          cat > artifact/manifest.json <<EOF
          {
            "project": "Classic_Retro",
            "reference_game": "Pokemon FireRed Version 1.1 (USA/Europe)",
            "base_sha1": "$BASE_SHA1",
            "base_sha256": "$BASE_SHA256",
            "target_sha256": "$TARGET_SHA256",
            "patch_sha256": "$PATCH_SHA256",
            "patch_bytes": $PATCH_BYTES,
            "format": "BPS",
            "scope": "all 13 Professor OAK speech strings in the new-game intro",
            "translation_language": "ar",
            "oak_messages": 13,
            "dynamic_ltr_placeholders": ["PLAYER", "RIVAL"],
            "dynamic_ltr_control": "FC 1B pp",
            "rtl_right_x": $RTL_RIGHT_X,
            "arabic_font": "Noto Kufi Arabic SemiBold",
            "font_sha256": "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e",
            "noto_fonts_commit": "ffebf8c1ee449e544955a7e813c54f9b73848eac",
            "font_license": "SIL Open Font License 1.1",
            "font_layout": "OpenType contextual forms; 16x14 FireRed copy bounds",
            "pokefirered_commit": "c75f352304d529f6ba92d4f74b9cf8b5c3810788",
            "agbcc_commit": "da598c1d918402c42c0c0d7128ba14567f3175e9",
            "flips_commit": "6caac470f7fc096b0c5fdc374b65954f8bac5b16"
          }
          EOF

      - name: Upload BPS patch only
        uses: actions/upload-artifact@v6
        with:
          name: firered-rev1-arabic-oak-full-bps
          path: |
            artifact/firered-rev1-arabic-oak-full.bps
            artifact/manifest.json
            artifact/build-report.json
            artifact/arabic_normal.png
            artifact/font-info.txt
            artifact/FONT-LICENSE.txt
          if-no-files-found: error
          retention-days: 14

  minish-cap-arabic-overlay:
    # zeldaret/tmc extracts its assets from the original ROM, which is never
    # uploaded. This job checks the overlay against the pinned source, measures
    # every Arabic line with the reference font and compiles the patched
    # renderer; the ROM and BPS are built locally (docs/MINISH_CAP_ARABIC_TEST_AR.md).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Classic Retro
        uses: actions/checkout@v6
        with:
          path: toolkit

      - name: Checkout pinned zeldaret/tmc
        uses: actions/checkout@v6
        with:
          repository: zeldaret/tmc
          ref: d92d4581e202ae531bdcc206a7d6a90ddb8fd907
          path: upstream-tmc

      - name: Checkout pinned agbcc
        uses: actions/checkout@v6
        with:
          repository: pret/agbcc
          ref: da598c1d918402c42c0c0d7128ba14567f3175e9
          path: agbcc

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev
          python -m pip install pycparser

      - name: Install toolkit
        working-directory: toolkit
        run: python -m pip install -e .

      - name: Check overlay, measure Arabic lines and apply it
        working-directory: toolkit
        run: |
          NOTO_COMMIT=ffebf8c1ee449e544955a7e813c54f9b73848eac
          ARABIC_FONT=../reference-font.ttf
          curl --fail --location "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/hinted/ttf/NotoKufiArabic/NotoKufiArabic-SemiBold.ttf" -o "$ARABIC_FONT"
          echo "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e  $ARABIC_FONT" | sha256sum -c -
          classic-retro tmc source-check ../upstream-tmc --font "$ARABIC_FONT"
          classic-retro tmc prepare-arabic-source ../upstream-tmc --font "$ARABIC_FONT" | tee ../tmc-build-report.json

      - name: Install agbcc into the tmc tree
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../upstream-tmc

      - name: Compile the patched renderer and Arabic font object (no ROM needed)
        working-directory: upstream-tmc
        run: |
          make tools
          make -f GBA.mk GAME_VERSION=USA build/USA/src/text.o build/USA/src/message.o build/USA/data/classic_retro_arabic.o

      - name: Upload overlay review files
        uses: actions/upload-artifact@v6
        with:
          name: minish-cap-arabic-overlay
          path: |
            tmc-build-report.json
            upstream-tmc/data/classic_retro/arabic_font_preview.png
          if-no-files-found: error
          retention-days: 14

  ff6a-arabic-overlay:
    # Final Fantasy VI Advance has no decompilation: the overlay patches the
    # user's own USA ROM locally (docs/FF6A_ARABIC_TEST_AR.md). CI re-assembles
    # the Thumb hooks and compares them with the stored bytes, measures every
    # Arabic line with the reference font, and checks the BPS writer against Flips.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Classic Retro
        uses: actions/checkout@v6
        with:
          path: toolkit

      - name: Checkout pinned Flips
        uses: actions/checkout@v6
        with:
          repository: bates64/flips
          ref: 6caac470f7fc096b0c5fdc374b65954f8bac5b16
          path: flips

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi

      - name: Install toolkit
        working-directory: toolkit
        run: python -m pip install -e .

      - name: Re-assemble the Thumb hooks and compare with the stored bytes
        run: classic-retro ff6a check-hooks

      - name: Validate the Arabic script and measure every line with the reference font
        run: |
          mkdir -p artifact
          NOTO_COMMIT=ffebf8c1ee449e544955a7e813c54f9b73848eac
          ARABIC_FONT=reference-font.ttf
          curl --fail --location "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/hinted/ttf/NotoKufiArabic/NotoKufiArabic-SemiBold.ttf" -o "$ARABIC_FONT"
          echo "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e  $ARABIC_FONT" | sha256sum -c -
          classic-retro ff6a check-translations --font "$ARABIC_FONT" --preview artifact/arabic_font_preview.png | tee artifact/translation-report.json

      - name: Build Flips CLI
        working-directory: flips
        run: TARGET=cli make CFLAGS="-O3"

      - name: Cross-check the BPS writer and reader with Flips
        run: |
          python - <<'PY'
          import random
          generator = random.Random(6)
          source = bytes(generator.getrandbits(8) for _ in range(400_000))
          target = bytearray(source)
          target[1000:1040] = b"A" * 40
          target += source[5000:90_000] + b"\xff" * 120_000
          open("source.bin", "wb").write(source)
          open("target.bin", "wb").write(bytes(target))
          PY
          classic-retro rebuild bps-create source.bin target.bin ours.bps
          ./flips/flips --apply ours.bps source.bin flips-out.bin
          cmp flips-out.bin target.bin
          ./flips/flips --create --exact --bps source.bin target.bin flips.bps
          classic-retro rebuild bps-apply flips.bps source.bin ours-out.bin
          cmp ours-out.bin target.bin

      - name: Upload translation review files
        uses: actions/upload-artifact@v6
        with:
          name: ff6a-arabic-overlay
          path: |
            artifact/translation-report.json
            artifact/arabic_font_preview.png
          if-no-files-found: error
          retention-days: 14

  golden-sun-arabic-overlay:
    # The gsret/goldensun disassembly rebuilds Golden Sun but cannot relocate
    # data yet: the overlay patches the user's own USA/Europe ROM locally
    # (docs/GOLDEN_SUN_ARABIC_TEST_AR.md). CI re-assembles the Thumb hooks and
    # compares them with the stored bytes, and measures every Arabic line with
    # the reference font.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Classic Retro
        uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Install toolkit
        run: python -m pip install -e .

      - name: Re-assemble the Thumb hooks and compare with the stored bytes
        run: classic-retro golden-sun check-hooks

      - name: Validate the Arabic script and measure every line with the reference font
        run: |
          mkdir -p artifact
          NOTO_COMMIT=ffebf8c1ee449e544955a7e813c54f9b73848eac
          ARABIC_FONT=reference-font.ttf
          curl --fail --location "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/hinted/ttf/NotoKufiArabic/NotoKufiArabic-SemiBold.ttf" -o "$ARABIC_FONT"
          echo "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e  $ARABIC_FONT" | sha256sum -c -
          classic-retro golden-sun check-translations --font "$ARABIC_FONT" --preview artifact/arabic_font_preview.png | tee artifact/translation-report.json

      - name: Upload translation review files
        uses: actions/upload-artifact@v6
        with:
          name: golden-sun-arabic-overlay
          path: |
            artifact/translation-report.json
            artifact/arabic_font_preview.png
          if-no-files-found: error
          retention-days: 14

  fire-emblem-arabic-overlay:
    # The fireemblem8u decompilation rebuilds The Sacred Stones but most of its
    # data is still binary: the overlay patches the user's own USA ROM locally
    # (docs/FIRE_EMBLEM_ARABIC_TEST_AR.md). CI re-assembles the Thumb hooks and
    # compares them with the stored bytes, measures every Arabic line with the
    # reference font, and draws the seven Arabic legend images.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Classic Retro
        uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Install toolkit
        run: python -m pip install -e .

      - name: Re-assemble the Thumb hooks and compare with the stored bytes
        run: classic-retro fire-emblem check-hooks

      - name: Validate the Arabic script and measure every line with the reference font
        run: |
          mkdir -p artifact
          NOTO_COMMIT=ffebf8c1ee449e544955a7e813c54f9b73848eac
          ARABIC_FONT=reference-font.ttf
          curl --fail --location "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/hinted/ttf/NotoKufiArabic/NotoKufiArabic-SemiBold.ttf" -o "$ARABIC_FONT"
          echo "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e  $ARABIC_FONT" | sha256sum -c -
          classic-retro fire-emblem check-translations --font "$ARABIC_FONT" --preview artifact/arabic_font_preview.png --legend-preview artifact/arabic_legend_preview.png | tee artifact/translation-report.json

      - name: Upload translation review files
        uses: actions/upload-artifact@v6
        with:
          name: fire-emblem-arabic-overlay
          path: |
            artifact/translation-report.json
            artifact/arabic_font_preview.png
            artifact/arabic_legend_preview.png
          if-no-files-found: error
          retention-days: 14

  pmd-red-arabic-overlay:
    # The pret/pmd-red decompilation rebuilds Red Rescue Team but its data is
    # still extracted from the original: the overlay patches the user's own USA
    # ROM locally (docs/PMD_RED_ARABIC_TEST_AR.md). CI re-assembles the Thumb
    # hooks and compares them with the stored bytes, and measures every Arabic
    # line of the personality test with the reference font.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Classic Retro
        uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Install toolkit
        run: python -m pip install -e .

      - name: Re-assemble the Thumb hooks and compare with the stored bytes
        run: classic-retro pmd check-hooks

      - name: Validate the Arabic script and measure every line with the reference font
        run: |
          mkdir -p artifact
          NOTO_COMMIT=ffebf8c1ee449e544955a7e813c54f9b73848eac
          ARABIC_FONT=reference-font.ttf
          curl --fail --location "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/hinted/ttf/NotoKufiArabic/NotoKufiArabic-SemiBold.ttf" -o "$ARABIC_FONT"
          echo "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e  $ARABIC_FONT" | sha256sum -c -
          classic-retro pmd check-translations --font "$ARABIC_FONT" --preview artifact/arabic_font_preview.png --text-preview artifact/arabic_text_preview.png | tee artifact/translation-report.json

      - name: Upload translation review files
        uses: actions/upload-artifact@v6
        with:
          name: pmd-red-arabic-overlay
          path: |
            artifact/translation-report.json
            artifact/arabic_font_preview.png
            artifact/arabic_text_preview.png
          if-no-files-found: error
          retention-days: 14
