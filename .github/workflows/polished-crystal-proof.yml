name: Polished Crystal Arabic proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/polished-crystal-proof.yml"
      - "src/classic_retro/source/polishedcrystal_opening.py"
      - "src/classic_retro/source/polishedcrystal_elm_sequence.py"
      - "src/classic_retro/source/polishedcrystal_elm_dynamic.py"
      - "src/classic_retro/source/polishedcrystal_catalog.py"
      - "src/classic_retro/research/commands.py"
      - "tests/test_polished_crystal_opening.py"
      - "tests/test_polished_crystal_elm_sequence.py"
      - "tests/test_polished_crystal_elm_dynamic.py"

jobs:
  arabic-opening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v6
        with:
          path: toolkit

      - name: Checkout exact Polished Crystal v3.2.3
        uses: actions/checkout@v6
        with:
          repository: Rangi42/polishedcrystal
          ref: 3fa43192379df5c3e7b09a08e4d5d79af4f02f42
          path: upstream

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install RGBDS v1.0.0, source build dependencies and Classic Retro
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev
          mkdir rgbds
          curl --fail --location --retry 3 \
            "https://github.com/gbdev/rgbds/releases/download/v1.0.0/rgbds-linux-x86_64.tar.xz" \
            -o rgbds-linux.tar.xz
          tar -xf rgbds-linux.tar.xz -C rgbds
          echo "$GITHUB_WORKSPACE/rgbds" >> "$GITHUB_PATH"
          python -m pip install -e ./toolkit -c toolkit/constraints.txt

      - name: Download pinned Arabic raster reference (font is never redistributed)
        run: |
          NOTO_COMMIT=ffebf8c1ee449e544955a7e813c54f9b73848eac
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/notofonts/noto-fonts/$NOTO_COMMIT/hinted/ttf/NotoKufiArabic/NotoKufiArabic-SemiBold.ttf" \
            -o reference-font.ttf
          echo "aa30cd2663f1eb1c940c9cd6a898877f307c2572e72a8a352896fe23f512018e  reference-font.ttf" | sha256sum -c -

      - name: Compile pristine upstream Game Boy Color ROM
        working-directory: upstream
        run: |
          rgbasm --version
          make -j2 crystal
          cp polishedcrystal-3.2.3.gbc ../base.gbc
          echo "6930b48af5844d373e3c9130f26d6dd1084cf4ed  ../base.gbc" | sha1sum -c -
          echo "f06dbebe3fd20db54e7804605f7a55ad05b8ca203c62209705290d8880864803  ../base.gbc" | sha256sum -c -

      - name: Apply RTL Arabic source overlays to Elm's static introduction scenes
        run: |
          mkdir artifact
          classic-retro research polished-crystal-elm-sequence upstream --dynamic-player --font reference-font.ttf \
            --preview artifact/elm-sequence-preview.png | tee artifact/overlay-report.json

      - name: Rebuild the patched GBC ROM
        working-directory: upstream
        run: |
          make tidy
          make -j2 crystal
          cp polishedcrystal-3.2.3.gbc ../patched.gbc
          test "$(stat -c %s ../patched.gbc)" -eq 2097152
          test "$(sha256sum ../patched.gbc | cut -d' ' -f1)" != \
            "f06dbebe3fd20db54e7804605f7a55ad05b8ca203c62209705290d8880864803"

      - name: Boot patched ROM in a Game Boy Color emulator and capture screens
        run: |
          python -m pip install "pyboy>=2.5,<3"
          python - <<'PY'
          import json
          from pathlib import Path

          from pyboy import PyBoy

          frames = [360, 780, 1200, 1700, 2200, 2600, 2900, 3200, 3500, 3800, 4100, 4400, 4700, 5000, 5500]

          def capture_rom(filename, prefix):
              emulator = PyBoy(filename, window="null", sound_emulated=False)
              emulator.set_emulation_speed(0)
              title = emulator.cartridge_title
              screenshots = {}
              for frame in range(1, max(frames) + 1):
                  if frame in (420, 500, 580, 660, 900, 1020, 1140, 1360, 1460, 1600, 1820, 1950):
                      emulator.button("a")
                  if frame in (360, 780, 1200):
                      emulator.button("start")
                  if frame >= 2300 and frame % 96 == 0:
                      emulator.button("a")
                  emulator.tick()
                  if frame in frames:
                      image = emulator.screen.image.copy().convert("RGB")
                      screenshot = f"artifact/{prefix}-frame-{frame:04}.png"
                      image.save(screenshot)
                      screenshots[str(frame)] = {
                          "filename": screenshot,
                          "colors": len(image.getcolors(maxcolors=65536) or []),
                          "blue_error_screen": image.getpixel((40, 35))[0] < 20 and image.getpixel((40, 35))[1] < 20 and image.getpixel((40, 35))[2] >= 224,
                      }
              emulator.stop(False)
              return {"title": title, "screenshots": screenshots}

          baseline = capture_rom("base.gbc", "baseline")
          patched = capture_rom("patched.gbc", "emulator")
          title = patched["title"]
          captures = patched["screenshots"]
          report = {
              "rom": "patched.gbc",
              "cartridge_title": title,
              "frames_tested": max(frames),
              "screenshot_frames": captures,
              "baseline": baseline,
              "patched": patched,
              "opening_text_confirmed": False,
              "note": "Identical scripted input into both original and patched ROM; inspect blue_error_screen before attributing crashes.",
          }
          Path("artifact/emulator-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          assert any(v["colors"] > 1 for v in captures.values()), "no nonblank frames"
          localized_crashes = [
              frame for frame, data in patched["screenshots"].items()
              if data["blue_error_screen"] and not baseline["screenshots"][frame]["blue_error_screen"]
          ]
          assert not localized_crashes, f"localized ROM crashed on frames {localized_crashes}"
          print(json.dumps(report, indent=2))
          PY

      - name: Create source-verified BPS only and verify roundtrip
        run: |
          classic-retro rebuild bps-create base.gbc patched.gbc artifact/polished-crystal-3.2.3-arabic-elm-sequence.bps
          classic-retro rebuild bps-apply artifact/polished-crystal-3.2.3-arabic-elm-sequence.bps base.gbc verified.gbc
          cmp verified.gbc patched.gbc
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          patch = Path("artifact/polished-crystal-3.2.3-arabic-elm-sequence.bps")
          manifest = {
              "source_rom_sha256": hashlib.sha256(Path("base.gbc").read_bytes()).hexdigest(),
              "target_rom_sha256": hashlib.sha256(Path("patched.gbc").read_bytes()).hexdigest(),
              "patch_sha256": hashlib.sha256(patch.read_bytes()).hexdigest(),
              "patch_bytes": patch.stat().st_size,
              "scope": "8 professor Elm intro scenes; 42 Arabic lines and live PLAYER placeholder in final message",
              "format": "BPS",
              "arabic_method": "banked 8x8 RTL line cells; final message keeps latin PLAYER tiles",
              "upstream_commit": "3fa43192379df5c3e7b09a08e4d5d79af4f02f42",
              "smoke_tested_in_emulator": True,
              "elm_dialogue_screen_confirmed": False,
              "whole_game_translated": False,
              "dynamic_player_name": True,
          }
          Path("artifact/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f verified.gbc patched.gbc base.gbc

      - name: Upload BPS, preview and manifest (never ROM or reference font)
        uses: actions/upload-artifact@v6
        with:
          name: polished-crystal-323-arabic-elm-sequence-bps
          path: |
            artifact/polished-crystal-3.2.3-arabic-elm-sequence.bps
            artifact/elm-sequence-preview.png
            artifact/emulator-frame-*.png
            artifact/baseline-frame-*.png
            artifact/emulator-report.json
            artifact/overlay-report.json
            artifact/manifest.json
          if-no-files-found: error
          retention-days: 14
