[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "classic-retro"
version = "0.1.0"
description = "Multi-platform Arabic localization toolkit for classic video games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "arabic-reshaper>=3.0.1,<4",
  "fonttools>=4.55,<5",
  "jsonschema>=4.23,<5",
  "Pillow>=12.3,<13",
  "pycdlib>=1.20,<2",
  "python-bidi>=0.6.11,<0.7",
  "uharfbuzz>=0.55,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
classic-retro = "classic_retro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/classic_retro"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-q"]
testpaths = ["tests"]
