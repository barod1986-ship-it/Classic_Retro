name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

  pokefirered-reference-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Classic Retro
        uses: actions/checkout@v6
        with:
          path: toolkit

      - name: Checkout pristine pinned pokefirered
        uses: actions/checkout@v6
        with:
          repository: pret/pokefirered
          ref: c75f352304d529f6ba92d4f74b9cf8b5c3810788
          path: upstream-base

      - name: Checkout Arabic target pokefirered
        uses: actions/checkout@v6
        with:
          repository: pret/pokefirered
          ref: c75f352304d529f6ba92d4f74b9cf8b5c3810788
          path: upstream-target

      - name: Checkout pinned agbcc
        uses: actions/checkout@v6
        with:
          repository: pret/agbcc
          ref: da598c1d918402c42c0c0d7128ba14567f3175e9
          path: agbcc

      - name: Checkout pinned Flips
        uses: actions/checkout@v6
        with:
          repository: bates64/flips
          ref: 6caac470f7fc096b0c5fdc374b65954f8bac5b16
          path: flips

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev fonts-dejavu-core

      - name: Install toolkit
        working-directory: toolkit
        run: python -m pip install -e .

      - name: Verify Arabic source overlay against pinned upstream
        working-directory: toolkit
        run: classic-retro pokemon-gen3 source-check ../upstream-target

      - name: Build agbcc and install into both source trees
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../upstream-base
          ./install.sh ../upstream-target

      - name: Build pristine FireRed Rev 1
        working-directory: upstream-base
        run: make -j2 firered_rev1

      - name: Verify pristine ROM identity
        working-directory: upstream-base
        run: |
          echo "dd5945db9b930750cb39d00c84da8571feebf417  pokefirered_rev1.gba" | sha1sum -c -
          test "$(sha256sum pokefirered_rev1.gba | awk '{print $1}')" = "729041b940afe031302d630fdbe57c0c145f3f7b6d9b8eca5e98678d0ca4d059"

      - name: Apply Arabic renderer, font, and first OAK translation
        working-directory: toolkit
        run: |
          classic-retro pokemon-gen3 prepare-arabic-source ../upstream-target --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Build Arabic FireRed Rev 1 with matching compiler
        working-directory: upstream-target
        run: make -j2 firered_rev1

      - name: Build Flips
        working-directory: flips
        run: g++ *.c *.cpp -O3 -o flips

      - name: Create and verify BPS patch
        run: |
          mkdir -p artifact
          ./flips/flips --create --exact --bps upstream-base/pokefirered_rev1.gba upstream-target/pokefirered_rev1.gba artifact/firered-rev1-arabic-oak-intro.bps
          ./flips/flips --apply artifact/firered-rev1-arabic-oak-intro.bps upstream-base/pokefirered_rev1.gba artifact/verified.gba
          cmp artifact/verified.gba upstream-target/pokefirered_rev1.gba
          rm artifact/verified.gba

      - name: Write patch manifest
        run: |
          BASE_SHA1="$(sha1sum upstream-base/pokefirered_rev1.gba | awk '{print $1}')"
          BASE_SHA256="$(sha256sum upstream-base/pokefirered_rev1.gba | awk '{print $1}')"
          TARGET_SHA256="$(sha256sum upstream-target/pokefirered_rev1.gba | awk '{print $1}')"
          PATCH_SHA256="$(sha256sum artifact/firered-rev1-arabic-oak-intro.bps | awk '{print $1}')"
          PATCH_BYTES="$(stat -c %s artifact/firered-rev1-arabic-oak-intro.bps)"
          cat > artifact/manifest.json <<EOF
          {
            "project": "Classic_Retro",
            "reference_game": "Pokemon FireRed Version 1.1 (USA/Europe)",
            "base_sha1": "$BASE_SHA1",
            "base_sha256": "$BASE_SHA256",
            "target_sha256": "$TARGET_SHA256",
            "patch_sha256": "$PATCH_SHA256",
            "patch_bytes": $PATCH_BYTES,
            "format": "BPS",
            "scope": "first Professor OAK welcome speech",
            "translation": [
              "مرحبا بك!",
              "سعيد بلقائك!",
              "أهلا بك في عالم بوكيمون!",
              "اسمي أوك.",
              "يناديني الناس بمحبة",
              "بروفيسور بوكيمون."
            ],
            "rtl_right_x": 216,
            "pokefirered_commit": "c75f352304d529f6ba92d4f74b9cf8b5c3810788",
            "agbcc_commit": "da598c1d918402c42c0c0d7128ba14567f3175e9",
            "flips_commit": "6caac470f7fc096b0c5fdc374b65954f8bac5b16"
          }
          EOF

      - name: Upload BPS patch only
        uses: actions/upload-artifact@v6
        with:
          name: firered-rev1-arabic-oak-intro-bps
          path: |
            artifact/firered-rev1-arabic-oak-intro.bps
            artifact/manifest.json
          if-no-files-found: error
          retention-days: 14
